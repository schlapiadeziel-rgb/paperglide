<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="manus-game-loading-screen" content="1">
  <title>$GODOT_PROJECT_NAME</title>
  <link rel="icon" type="image/png" href="game-favicon.png">
  $GODOT_HEAD_INCLUDE
  <!-- Project-owned loading shell generated by web/build-shell.mjs. -->
  <style>
{{MANUS_FONTS}}
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f4efe0; color: #394957; font-family: "Noto Sans SC", sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: end center; gap: 12px; box-sizing: border-box; overflow: auto; isolation: isolate;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(44px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: #f4efe0; text-align: center; }
    #loading::before { content: ""; position: fixed; inset: 0; z-index: -2; background: url("notebook-loader.png") center / cover no-repeat; opacity: 0.78; pointer-events: none; }
    #loading::after { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(0deg, #f4efe0 0%, #f4efe0ed 12%, #f4efe088 38%, transparent 82%); pointer-events: none; }
    #loading[hidden], [hidden] { display: none !important; }
    #loading > * { max-width: min(560px, 100%); justify-self: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .game-icon { width: 82px; height: 82px; object-fit: contain; border-radius: 18px; box-shadow: 0 6px 22px #4b647522; }
    #loading-status { margin: 0; font-size: 15px; letter-spacing: 0.12em; color: #486d89; text-shadow: 0 1px 0 #fffaf0; }
    #loading-tip { margin: 0; font-family: "Noto Sans SC", sans-serif; font-weight: 600; font-size: 14px; color: #526879; opacity: 0.94; min-height: 1.4em; }
    #loading-notice { margin: 0; max-width: 380px; line-height: 1.5; font-family: "Noto Sans SC", sans-serif; font-size: 14px; }
    .bar { width: min(380px, 78vw); height: 14px; justify-self: center; padding: 3px; box-sizing: border-box; border: 2px solid #7b99ad; background: #fffaf0cc; }
    .bar > span { display: block; height: 100%; width: 0%; background: repeating-linear-gradient(90deg, #6f98b3 0 14px, #aac2ce 14px 18px); transition: width 0.2s ease-out; }
    .bar.indeterminate > span { width: 30%; animation: sweep 1.1s ease-in-out infinite alternate; }
    @keyframes sweep { from { margin-left: 0; } to { margin-left: 70%; } }
    progress { position: absolute; width: 1px; height: 1px; opacity: 0; }
    #loading button { justify-self: center; min-height: 44px; padding: 10px 28px; cursor: pointer; font: inherit; font-size: 15px; letter-spacing: 0.12em;
      border: 2px solid #557f9e; border-radius: 10px; background: #fffaf0; color: #3b617d; }
    #loading button:hover { background: #e9f0ee; color: #344c5e; }
    #loading button:focus-visible { outline: 3px solid #557f9e; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } .bar.indeterminate > span { animation: none; width: 100%; opacity: 0.5; } }
    @media (max-aspect-ratio: 1/1) { #loading::before { background-size: 100% auto; } #loading { place-content: center; padding-top: calc(100vw * 0.55); } }
    @media (max-height: 480px) and (min-aspect-ratio: 1/1) { #loading { place-content: end end; padding: 16px 24px; } #loading > * { max-width: 44vw; } .bar { width: min(280px, 40vw); } }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Your browser does not support canvas.</canvas>
  <section id="loading" role="status">
    <h1 id="game-title" class="sr-only"></h1>
    <img class="game-icon" src="game-favicon.png" alt="纸上飞行">
    <p id="loading-status">正在准备纸页…</p>
    <div class="bar indeterminate" id="loading-bar" aria-hidden="true"><span></span></div>
    <progress id="loading-progress" aria-label="载入进度"></progress>
    <p id="loading-tip">提示：轻点一下，让纸飞机向上跃起。</p>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>重试</button>
    <noscript>请启用 JavaScript 后再开始游戏。</noscript>
  </section>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const bar = document.getElementById('loading-bar');
      const fill = bar.firstElementChild;
      const tip = document.getElementById('loading-tip');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      document.getElementById('game-title').textContent = document.title;
      document.documentElement.lang = 'zh-Hans';
      retry.addEventListener('click', () => window.location.reload());
      const tips = [
        '提示：轻点一下，让纸飞机向上跃起。',
        '提示：松开后，重力会把纸飞机慢慢拉下。',
        '提示：穿过铅笔管道之间的空隙即可得分。'
      ];
      let tipIndex = 0;
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const tipTimer = reduced ? 0 : setInterval(() => { tipIndex = (tipIndex + 1) % tips.length; tip.textContent = tips[tipIndex]; }, 3200);
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? '载入暂时没有进展，你可以继续等待或重试。'
          : '正在载入游戏，你可以继续等待或重试。';
        if (notice.textContent !== message) notice.textContent = message;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      // Time alone cannot prove failure: downloads and WASM compilation may be slow.
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        if (tipTimer) clearInterval(tipTimer);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        status.textContent = '游戏载入失败，请重试。';
        bar.hidden = true;
        progress.hidden = true;
        notice.hidden = true;
        tip.hidden = true;
        retry.hidden = false;
      };
      // Some Godot bootstrap promises do not forward download/compile failures.
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        // Repeated/unknown totals do not renew liveness; growing byte counts do.
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          bar.classList.add('indeterminate');
          status.textContent = '正在载入…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        bar.classList.remove('indeterminate');
        fill.style.width = `${Math.min(100, current / total * 100)}%`;
        status.textContent = current >= total ? '正在启动…' : `正在载入 ${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          // Download completion alone is not engine readiness.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
